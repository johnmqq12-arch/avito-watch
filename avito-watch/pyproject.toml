[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-watch"
version = "1.0.0"
description = "Личный парсер Авито: несколько ссылок, SQLite-дедупликация, уведомления в Telegram, локальное решение капчи"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "playwright>=1.44",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "Pillow>=10.3",
]

[project.optional-dependencies]
ocr = ["ddddocr>=1.4.11", "onnxruntime>=1.17"]
http = ["curl_cffi>=0.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
avito-watch = "avito_watch.cli:main"

[tool.setuptools.packages.find]
include = ["avito_watch*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not browser'"
markers = [
    "browser: интеграционные тесты на настоящем Chromium (pytest -m browser)",
]
filterwarnings = ["ignore::DeprecationWarning"]
